name: gates
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  offline-gate-suite:
    runs-on: ubuntu-latest
    # The loopback gate deliberately idles for 14s and pushes 1100 messages
    # through a real socket, so it is slower than a pure vector suite.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # cl-consensus, pagetree, secp256k1-fast and cl-transport are not on Quicklisp;
          # they are vendored under deps/ and pinned by commit.
          submodules: recursive
      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl curl
      - name: Install Quicklisp + runtime deps
        run: |
          curl -sL https://beta.quicklisp.org/quicklisp.lisp -o /tmp/ql.lisp
          sbcl --non-interactive --load /tmp/ql.lisp \
            --eval '(quicklisp-quickstart:install)' \
            --eval '(ql-util:without-prompting (ql:add-to-init-file))' \
            --eval '(ql:quickload (list :ironclad :usocket :bordeaux-threads :hunchentoot))'
      - name: Offline gate suite
        run: inspect/run-all.sh
      - name: Gate logs on failure
        if: failure()
        run: for f in /tmp/cl-deposits-gate-*.log; do echo "===== $f ====="; tail -80 "$f"; done

  # secp256k1-fast's own suite, including the concurrency check that cl-deposits
  # depends on.  Run here as well as upstream: cl-deposits derives an ephemeral
  # key per connection and builds taproot outputs on worker threads, so a
  # regression in the backend's thread safety (CT-MUL-G, or the affine
  # point/inverse entry points the chaos gate once caught) corrupts keys here
  # first and is far cheaper to catch at this pin than in production.
  dependency-thread-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl
      - name: secp256k1-fast test suite
        run: |
          export CL_SOURCE_REGISTRY="(:source-registry (:tree \"$PWD\") :inherit-configuration)"
          sbcl --non-interactive \
            --eval '(require :asdf)' \
            --eval '(asdf:test-system "secp256k1-fast")'

  # End to end on a private regtest chain: bitcoind, the devnet relay, four
  # daemons over real sockets, on-chain funded QuorumBegin, cosigned deposits
  # and transfers, and a full dispute (confiscation and lottery claim confirmed
  # on chain).  Lightning steps are skipped here; the signet devnet runs them.
  regtest-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SBCL, Python websockets
        run: |
          sudo apt-get update && sudo apt-get install -y sbcl curl python3-websockets
      - name: Install Quicklisp + runtime deps
        run: |
          curl -sL https://beta.quicklisp.org/quicklisp.lisp -o /tmp/ql.lisp
          sbcl --non-interactive --load /tmp/ql.lisp \
            --eval '(quicklisp-quickstart:install)' \
            --eval '(ql-util:without-prompting (ql:add-to-init-file))' \
            --eval '(ql:quickload (list :ironclad :usocket :bordeaux-threads :hunchentoot))'
      - name: Install beacon (the devnet relay)
        run: |
          git clone --depth 1 https://github.com/modus-lisp/beacon.git ~/quicklisp/local-projects/beacon
          git clone --depth 1 https://github.com/modus-lisp/secp256k1-fast.git ~/quicklisp/local-projects/secp256k1-fast
          git clone --depth 1 https://github.com/modus-lisp/json-simple.git ~/quicklisp/local-projects/json-simple
          sbcl --non-interactive --load ~/quicklisp/setup.lisp --eval '(ql:quickload :beacon)'
      - name: Install Bitcoin Core 28.1
        run: |
          curl -sSL -o /tmp/btc.tgz https://bitcoincore.org/bin/bitcoin-core-28.1/bitcoin-28.1-x86_64-linux-gnu.tar.gz
          echo "07f77afd326639145b9ba9562912b2ad2ccec47b8a305bd075b4f4cb127b7ed7  /tmp/btc.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/btc.tgz -C /opt && sudo ln -s /opt/bitcoin-28.1/bin/bitcoind /opt/bitcoin-28.1/bin/bitcoin-cli /usr/local/bin/
      - name: Regtest smoke
        run: CLD_SRC="$PWD" devnet/regtest.sh
